[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riverwarden"
dynamic = ["version"]
description = "Fleet control for stock-firmware IceRiver miners: status, fan, sleep/wake, room thermostat, REST API and MCP server (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wisteria Corp" }]
dependencies = ["PyYAML>=6"]
keywords = ["iceriver", "asic", "miner", "fleet", "thermostat", "mcp", "alephium", "kaspa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
riverwarden = "riverwarden.cli:run"

[tool.setuptools.dynamic]
version = { attr = "riverwarden.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
